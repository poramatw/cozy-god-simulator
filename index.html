<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronicles of Morimar — Cozy Life & God Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Itim&family=Mali:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #141c24;
        font-family: 'Chakra Petch', 'Mali', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #game-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #ui-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 30;
      }
      canvas {
        display: block;
      }
      /* Cozy Storybook Parchment & Wood Loading Screen Overlay */
      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: radial-gradient(circle at 50% 42%, #2c211b 0%, #15100d 80%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #2c1e16;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #loading-screen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loader-card {
        width: 440px;
        max-width: 90vw;
        padding: 28px 26px;
        border-radius: 12px;
        background: linear-gradient(180deg, #fdfbf7 0%, #f3e9d2 100%);
        border: 3px solid #6e473b;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.72), inset 0 0 0 2px #d4b895;
        text-align: center;
      }
      .loader-badge {
        display: inline-block;
        padding: 3px 12px;
        border-radius: 999px;
        background: #e6d5b8;
        border: 1px solid #8c5a3c;
        color: #6e473b;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 10px;
      }
      .loader-title {
        font-family: 'Itim', 'Chakra Petch', cursive;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #3e2723;
        margin-bottom: 4px;
      }
      .loader-subtitle {
        font-size: 12.5px;
        color: #6e473b;
        margin-bottom: 20px;
        font-weight: 600;
      }
      .loader-track {
        width: 100%;
        height: 10px;
        background: #dfd1b8;
        border-radius: 6px;
        overflow: hidden;
        border: 1.5px solid #8c5a3c;
        margin-bottom: 10px;
      }
      .loader-fill {
        height: 100%;
        width: 8%;
        background: linear-gradient(90deg, #b45309 0%, #d97706 55%, #15803d 100%);
        border-radius: 4px;
        transition: width 0.22s ease;
      }
      .loader-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        color: #4e342e;
        font-weight: 600;
      }
      .loader-pct {
        font-weight: 700;
        color: #b45309;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="loader-card">
        <div class="loader-badge">📖 COZY STORYBOOK GOD SIMULATOR</div>
        <div class="loader-title">CHRONICLES OF MORIMAR</div>
        <div class="loader-subtitle">สมุดบันทึกเทพเจ้า วิวัฒนาการอารยธรรม 5 ยุคสมัย และสายเลือดตระกูล</div>
        <div class="loader-track">
          <div class="loader-fill" id="loader-bar-fill"></div>
        </div>
        <div class="loader-meta">
          <span id="loader-step-text">กำลังเปิดสมุดบันทึกแห่งโมริมาร์...</span>
          <span class="loader-pct" id="loader-pct-text">8%</span>
        </div>
      </div>
    </div>
    <div id="game-container"></div>
    <div id="ui-layer"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
