<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronicles of Morimar — God & Civilization Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #060911;
        font-family: 'Chakra Petch', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #game-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #ui-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 30;
      }
      canvas {
        display: block;
      }
      /* Studio Loading Screen Overlay */
      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: radial-gradient(circle at 50% 42%, #111a2e 0%, #070a12 75%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #f8fafc;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #loading-screen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loader-card {
        width: 420px;
        max-width: 90vw;
        padding: 28px 26px;
        border-radius: 8px;
        background: rgba(11, 15, 24, 0.88);
        border: 1px solid rgba(212, 175, 106, 0.35);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
        text-align: center;
      }
      .loader-badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 4px;
        background: rgba(245, 158, 11, 0.14);
        border: 1px solid rgba(245, 158, 11, 0.4);
        color: #fbbf24;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 10px;
      }
      .loader-title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: #f8fafc;
        margin-bottom: 4px;
      }
      .loader-subtitle {
        font-size: 12px;
        color: #94a3b8;
        margin-bottom: 20px;
      }
      .loader-track {
        width: 100%;
        height: 8px;
        background: rgba(30, 41, 59, 0.95);
        border-radius: 4px;
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.2);
        margin-bottom: 10px;
      }
      .loader-fill {
        height: 100%;
        width: 8%;
        background: linear-gradient(90deg, #d97706 0%, #fbbf24 55%, #38bdf8 100%);
        border-radius: 4px;
        transition: width 0.22s ease;
      }
      .loader-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11.5px;
        color: #cbd5e1;
      }
      .loader-pct {
        font-weight: 700;
        color: #fbbf24;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="loader-card">
        <div class="loader-badge">WORLD SIMULATION ENGINE</div>
        <div class="loader-title">CHRONICLES OF MORIMAR</div>
        <div class="loader-subtitle">จำลองชีวิต จิตวิเคราะห์ และวิวัฒนาการอารยธรรม 5 ยุคสมัย</div>
        <div class="loader-track">
          <div class="loader-fill" id="loader-bar-fill"></div>
        </div>
        <div class="loader-meta">
          <span id="loader-step-text">กำลังเตรียมเอนจินจำลองโลก...</span>
          <span class="loader-pct" id="loader-pct-text">8%</span>
        </div>
      </div>
    </div>
    <div id="game-container"></div>
    <div id="ui-layer"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
